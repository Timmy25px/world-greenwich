<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>World Time Grid 2026</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: black;
}

/* FULL SCREEN MAP */
#map {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("https://www.bing.com/images/search?view=detailV2&ccid=kUP%2bj7Av&id=85BB3450BA05DC07FEA06718E4F2AA2EB4152A2F&thid=OIP.kUP-j7AvDcrTUxDqMHQNUgHaD6&mediaurl=https%3a%2f%2flululataupe.com%2fimages%2fdecouverte%2fgeographie%2fcarte-du-monde-avec-capitales-pays.png") center/cover no-repeat;
  filter: contrast(1.1) brightness(0.9);
}

/* ZONES OVERLAY */
.zone {
  position: absolute;
  top: 0;
  bottom: 0;
  opacity: 0.15;
  cursor: pointer;
  transition: 0.2s;
}

.zone:hover {
  opacity: 0.35;
  outline: 2px solid white;
}

/* POPUP PANEL */
#popup {
  position: absolute;
  right: -320px;
  top: 10%;
  width: 300px;
  background: rgba(20,20,30,0.95);
  color: white;
  padding: 20px;
  border-radius: 12px 0 0 12px;
  transition: 0.4s;
  box-shadow: -10px 0 30px rgba(0,0,0,0.6);
}

#popup.open {
  right: 0;
}

#close {
  position: absolute;
  top: 8px;
  right: 10px;
  cursor: pointer;
  font-weight: bold;
}

/* TITLE */
h2 {
  margin-top: 0;
  font-size: 18px;
}

.small {
  font-size: 12px;
  opacity: 0.8;
}
</style>
</head>

<body>
<div style="
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: url('carte_monde.jpg') center/cover no-repeat;
">
</div>

<div id="map"></div>

<div id="popup">
  <div id="close">✕</div>
  <h2 id="title">Fuseau</h2>
  <div id="time"></div>
  <div class="small" id="meta"></div>
</div>

<script>

const popup = document.getElementById("popup");
const title = document.getElementById("title");
const timeBox = document.getElementById("time");
const meta = document.getElementById("meta");
const closeBtn = document.getElementById("close");

let currentZone = null;
let timerInterval = null;

// fuseaux réels
const zones = [
  {name:"UTC-12", offset:-720},
  {name:"UTC-11", offset:-660},
  {name:"UTC-10", offset:-600},
  {name:"UTC-9:30", offset:-570},
  {name:"UTC-9", offset:-540},
  {name:"UTC-8", offset:-480},
  {name:"UTC-7", offset:-420},
  {name:"UTC-6", offset:-360},
  {name:"UTC-5", offset:-300},
  {name:"UTC-4:30", offset:-270},
  {name:"UTC-4", offset:-240},
  {name:"UTC-3:30", offset:-210},
  {name:"UTC-3", offset:-180},
  {name:"UTC-2", offset:-120},
  {name:"UTC-1", offset:-60},
  {name:"UTC+0", offset:0},
  {name:"UTC+1 (France)", offset:60},
  {name:"UTC+2", offset:120},
  {name:"UTC+3", offset:180},
  {name:"UTC+3:30 (Iran)", offset:210},
  {name:"UTC+4", offset:240},
  {name:"UTC+4:30 (Afghanistan)", offset:270},
  {name:"UTC+5", offset:300},
  {name:"UTC+5:30 (Inde)", offset:330},
  {name:"UTC+5:45 (Nepal)", offset:345},
  {name:"UTC+6", offset:360},
  {name:"UTC+6:30 (Myanmar)", offset:390},
  {name:"UTC+7", offset:420},
  {name:"UTC+8", offset:480},
  {name:"UTC+9", offset:540},
  {name:"UTC+9:30", offset:570},
  {name:"UTC+10", offset:600},
  {name:"UTC+11", offset:660},
  {name:"UTC+12", offset:720},
  {name:"UTC+13", offset:780},
  {name:"UTC+14", offset:840},
  {name:"UTC+15 (expérimental)", offset:900}
];

const map = document.getElementById("map");

const step = 100 / zones.length;

zones.forEach((z, i) => {
  const div = document.createElement("div");
  div.className = "zone";
  div.style.left = (i * step) + "%";
  div.style.width = step + "%";
  div.style.background = i % 2 ? "deepskyblue" : "violet";

  div.onclick = () => openZone(z);

  map.appendChild(div);
});

function formatTime(date) {
  return date.toLocaleString("fr-FR", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
}

function updateClock() {
  if (!currentZone) return;

  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const local = new Date(utc + currentZone.offset * 60000);

  timeBox.innerHTML = "🕒 " + formatTime(local);
}

function openZone(z) {
  popup.classList.add("open");
  currentZone = z;

  // nettoyage des infos type pays (parenthèses supprimées)
  title.textContent = z.name.replace(/\s*\(.*?\)/g, '');

  meta.innerHTML = "Offset : " + z.offset + " minutes<br>Mode : service temps mondial 2026";

  updateClock();

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateClock, 1000);
}

closeBtn.onclick = () => {
  popup.classList.remove("open");
  currentZone = null;
  clearInterval(timerInterval);
};

</script>

</body>
</html>
